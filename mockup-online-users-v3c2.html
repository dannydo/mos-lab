<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Users V3C2 — Dropdown + Slide-in Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gold: '#D4A84B',
              goldLight: '#E8C97A',
              goldDark: '#B8912F',
              darkBg: '#0A0A0A',
              darkCard: '#141414',
              darkBorder: '#262626',
              darkHover: '#1A1A1A',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      /* Glass card */
      .glass-card {
        background: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .glass-card-light {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 168, 75, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 168, 75, 0.5);
      }

      /* Modal animations */
      .modal-overlay {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal-content {
        transform: scale(0.9);
        opacity: 0;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s ease;
      }
      .modal-overlay.active .modal-content {
        transform: scale(1);
        opacity: 1;
      }

      /* Bubble stack */
      .bubble-stack {
        display: flex;
        align-items: center;
      }
      .bubble-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        margin-left: -8px;
        transition:
          transform 0.2s ease,
          margin 0.2s ease;
        cursor: pointer;
        position: relative;
        z-index: 1;
      }
      .bubble-avatar:first-child {
        margin-left: 0;
      }
      .bubble-avatar:hover {
        transform: translateY(-4px) scale(1.15);
        z-index: 10;
      }

      /* Donut */
      .donut-ring {
        transition: stroke-dasharray 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Metric pill */
      .metric-pill {
        transition: all 0.2s ease;
      }
      .metric-pill:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      /* Mini card */
      .mini-card {
        transition: all 0.25s ease;
      }
      .mini-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }

      /* Podium */
      .podium-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 100px));
        justify-content: center;
        gap: 8px;
        align-items: end;
      }
      .podium-col {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .podium-avatar-section {
        height: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 6px;
      }
      .podium-bar {
        width: 100%;
        border-radius: 10px 10px 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 4px;
        position: relative;
      }

      /* Dropdown */
      .dropdown-menu {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.25s ease;
      }
      .dropdown-menu.open {
        max-height: 400px;
        opacity: 1;
      }

      /* Config panel slide-in */
      .config-panel {
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .config-panel.open {
        transform: translateX(0);
      }

      /* Collapsible section */
      .config-section-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .config-section-body.expanded {
        max-height: 500px;
      }

      /* Toast */
      .toast {
        transform: translateX(120%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .toast.show {
        transform: translateX(0);
      }

      /* Pulse dot */
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.5);
        }
      }
      .pulse-dot {
        animation: pulse-dot 2s ease-in-out infinite;
      }

      /* Number input styling */
      input[type='number']::-webkit-inner-spin-button,
      input[type='number']::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type='number'] {
        -moz-appearance: textfield;
      }

      /* Toggle switch */
      .toggle-track {
        width: 44px;
        height: 24px;
        border-radius: 12px;
        background: #333;
        position: relative;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      .toggle-track.active {
        background: #d4a84b;
      }
      .toggle-knob {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }
      .toggle-track.active .toggle-knob {
        transform: translateX(20px);
      }

      /* Count badge bounce */
      @keyframes badge-bounce {
        0% {
          transform: scale(0.8);
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      .count-badge {
        animation: badge-bounce 0.5s ease;
      }
    </style>
  </head>

                    </button>
                    <button

          VT: { revenue: 25.0, customers: 36, services: 52, rating: 4.5, retention: 64 },
          KL: { revenue: 41.0, customers: 56, services: 84, rating: 4.8, retention: 77 },
          TH: { revenue: 21.0, customers: 31, services: 45, rating: 4.4, retention: 60 },
        },
        last_month: {

          DD: { revenue: 125.0, customers: 172, services: 268, rating: 4.6, retention: 69 },

          VT: { revenue: 100.0, customers: 142, services: 218, rating: 4.5, retention: 65 },
          KL: { revenue: 160.0, customers: 220, services: 342, rating: 4.8, retention: 78 },

        },
      };

      // Targets per period
      let targets = {
        today: { revenue: 10, customers: 15, services: 20, rating: 5.0, retention: 80 },
        this_week: { revenue: 50, customers: 70, services: 100, rating: 5.0, retention: 80 },
        this_month: { revenue: 200, customers: 280, services: 400, rating: 5.0, retention: 80 },
        yesterday: { revenue: 10, customers: 15, services: 20, rating: 5.0, retention: 80 },
        last_week: { revenue: 50, customers: 70, services: 100, rating: 5.0, retention: 80 },

      };

      // ===== STATE =====
      let currentPeriod = 'today';
      let sortMetric = 'revenue';

      let configPanelOpen = false;
      const sortMetrics = ['revenue', 'customers', 'services', 'rating', 'retention'];
      let sortIndex = 0;

      // ===== INIT =====
      document.addEventListener('DOMContentLoaded', () => {
        renderHeaderBubbles();
        updateClock();
        setInterval(updateClock, 1000);
        updateDropdownDots();
        renderAll();
        // Close dropdown on outside click
        document.addEventListener('click', (e) => {
          const container = document.getElementById('dropdownContainer');
          if (dropdownOpen && !container.contains(e.target)) {
            closeDropdown();
          }
        });
      });

      // ===== HEADER =====
      function renderHeaderBubbles() {
        const el = document.getElementById('headerBubbles');
        // Show first 5 then +N
        const show = members.slice(0, 5);
        el.innerHTML = show
          .map((m) => `<div class="bubble-avatar bg-gradient-to-br ${m.color}">${m.id}</div>`)
          .join('');
        if (members.length > 5) {
          el.innerHTML += `<div class="bubble-avatar bg-darkCard border-darkBorder text-white/50 text-[10px]">+${members.length - 5}</div>`;
        }
      }

      function updateClock() {
        const now = new Date();
        document.getElementById('headerClock').textContent = now.toLocaleTimeString('vi-VN', {
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      // ===== MODAL =====
      function openModal() {
        document.getElementById('modalOverlay').classList.add('active');
      }
      function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        closeDropdown();
        if (configPanelOpen) toggleConfigPanel();
      }
      function handleOverlayClick(e) {
        if (e.target === document.getElementById('modalOverlay') || e.target.classList.contains('backdrop-blur-sm')) {
          closeModal();
        }
      }

      // ===== DROPDOWN =====
      function toggleDropdown() {
        dropdownOpen = !dropdownOpen;
        const menu = document.getElementById('dropdownMenu');
        const arrow = document.getElementById('dropdownArrow');
        if (dropdownOpen) {
          menu.classList.add('open');
          arrow.style.transform = 'rotate(180deg)';
        } else {
          closeDropdown();
        }
      }
      function closeDropdown() {
        dropdownOpen = false;
        document.getElementById('dropdownMenu').classList.remove('open');
        document.getElementById('dropdownArrow').style.transform = 'rotate(0deg)';
      }
      function selectPeriod(period) {
        currentPeriod = period;
        document.getElementById('dropdownLabel').textContent = periodLabels[period];
        updateDropdownDots();
        closeDropdown();
        renderAll();
        // Update config panel period label
        document.getElementById('configPeriodLabel').textContent = periodLabels[period];
        if (configPanelOpen) renderConfigPanel();
      }
      function updateDropdownDots() {
        document.querySelectorAll('.dropdown-item').forEach((item) => {
          const dot = item.querySelector('.period-dot');
          if (item.dataset.period === currentPeriod) {
            dot.style.opacity = '1';
            item.classList.add('bg-white/5');
          } else {
            dot.style.opacity = '0';
            item.classList.remove('bg-white/5');
          }
        });
      }

      // ===== SORT =====
      function cycleSortMetric() {
        sortIndex = (sortIndex + 1) % sortMetrics.length;
        sortMetric = sortMetrics[sortIndex];
        const m = metrics.find((x) => x.key === sortMetric);
        document.getElementById('sortLabel').innerHTML = `<i class="fas fa-sort-amount-down mr-1"></i>${m.label}`;
        renderAll();
      }

      // ===== THEME =====
      function toggleTheme() {
        const html = document.documentElement;
        const track = document.getElementById('themeToggle');
        html.classList.toggle('dark');
        track.classList.toggle('active');
      }

      // ===== RENDER ALL =====
      function renderAll() {
        const data = memberData[currentPeriod];
        const target = targets[currentPeriod];
        renderDonut(data, target);
        renderMetricPills(data, target);
        renderMiniCards(data);
        renderPodium(data);
      }

      // ===== DONUT =====
      function renderDonut(data, target) {
        const svg = document.getElementById('donutSvg');
        // Remove old rings
        svg.querySelectorAll('.donut-ring').forEach((el) => el.remove());

        // Compute total per metric as % of target, average across metrics
        let totalScore = 0;
        metrics.forEach((m) => {
          let sum = 0;
          members.forEach((mem) => (sum += data[mem.id][m.key]));
          const avg = sum / members.length;
          let pct;
          if (m.format === 'rating') pct = (avg / target[m.key]) * 100;
          else if (m.format === 'percent') pct = (avg / target[m.key]) * 100;
          else pct = (sum / (target[m.key] * members.length)) * 100;
          totalScore += Math.min(pct, 100);
        });
        const overallPct = totalScore / metrics.length;
        document.getElementById('donutTotal').textContent = Math.round(overallPct) + '%';

        // Render per-metric arcs
        const r = 58,
          circumference = 2 * Math.PI * r;
        const gapDeg = 4;
        const totalGap = gapDeg * metrics.length;
        const availableDeg = 360 - totalGap;
        const perMetricDeg = availableDeg / metrics.length;

        let offsetDeg = -90;
        const metricColors = ['#34d399', '#60a5fa', '#c084fc', '#facc15', '#f472b6'];

        metrics.forEach((m, i) => {
          let sum = 0;
          members.forEach((mem) => (sum += data[mem.id][m.key]));
          const avg = sum / members.length;
          let pct;
          if (m.format === 'rating') pct = (avg / target[m.key]) * 100;
          else if (m.format === 'percent') pct = (avg / target[m.key]) * 100;
          else pct = (sum / (target[m.key] * members.length)) * 100;
          pct = Math.min(pct, 100);

          const arcLen = (perMetricDeg / 360) * circumference;
          const filledLen = arcLen * (pct / 100);
          const dashArray = `${filledLen} ${circumference - filledLen}`;
          const dashOffset = -(offsetDeg / 360) * circumference;

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('class', 'donut-ring');
          circle.setAttribute('cx', '75');
          circle.setAttribute('cy', '75');
          circle.setAttribute('r', String(r));
          circle.setAttribute('fill', 'none');
          circle.setAttribute('stroke', metricColors[i]);
          circle.setAttribute('stroke-width', '14');
          circle.setAttribute('stroke-linecap', 'round');
          circle.setAttribute('stroke-dasharray', dashArray);
          circle.setAttribute('stroke-dashoffset', String(dashOffset));
          circle.setAttribute('opacity', '0.85');
          circle.style.transition = 'stroke-dasharray 0.8s cubic-bezier(0.4,0,0.2,1)';
          svg.appendChild(circle);

          offsetDeg += perMetricDeg + gapDeg;
        });
      }

      // ===== METRIC PILLS =====
      function renderMetricPills(data, target) {
        const el = document.getElementById('metricPills');
        el.innerHTML = metrics
          .map((m) => {
            let sum = 0;
            members.forEach((mem) => (sum += data[mem.id][m.key]));
            let display, pct;
            if (m.format === 'rating') {
              const avg = (sum / members.length).toFixed(1);
              display = avg + '★';
              pct = Math.round((avg / target[m.key]) * 100);
            } else if (m.format === 'percent') {
              const avg = Math.round(sum / members.length);
              display = avg + '%';
              pct = Math.round((avg / target[m.key]) * 100);
            } else if (m.format === 'currency') {
              display = sum.toFixed(1) + 'tr';
              pct = Math.round((sum / (target[m.key] * members.length)) * 100);
            } else {
              display = sum;
              pct = Math.round((sum / (target[m.key] * members.length)) * 100);
            }
            pct = Math.min(pct, 100);
            const pctColor = pct >= 80 ? 'text-emerald-400' : pct >= 50 ? 'text-yellow-400' : 'text-red-400';
            return `
      <div class="metric-pill rounded-xl bg-white/[0.03] border border-darkBorder p-2.5 text-center">
        <div class="flex items-center justify-center gap-1 mb-1">
          <i class="fas ${m.icon} ${m.color} text-[10px]"></i>
          <span class="text-[10px] text-white/40">${m.label}</span>
        </div>
        <div class="text-sm font-bold text-white">${display}</div>
        <div class="text-[10px] ${pctColor} font-semibold mt-0.5">${pct}%</div>
      </div>
    `;
          })
          .join('');
      }

      // ===== MINI CARDS =====
      function renderMiniCards(data) {
        const el = document.getElementById('miniCards');
        const sorted = [...members].sort((a, b) => data[b.id][sortMetric] - data[a.id][sortMetric]);

        el.innerHTML = sorted
          .map((m, i) => {
            const d = data[m.id];
            const rank = i + 1;
            const rankBadge =
              rank <= 3
                ? `<span class="text-[9px] font-bold ${rank === 1 ? 'text-yellow-400' : rank === 2 ? 'text-gray-300' : 'text-orange-400'}">#${rank}</span>`
                : `<span class="text-[9px] text-white/20">#${rank}</span>`;

            return `
      <div class="mini-card rounded-xl bg-white/[0.03] border border-darkBorder p-3 cursor-pointer">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-gradient-to-br ${m.color} flex items-center justify-center text-[10px] font-bold text-white">${m.id}</div>
            <div>
              <div class="text-xs font-semibold text-white">${m.name}</div>
              <div class="text-[9px] text-white/30">${rankBadge}</div>
            </div>
          </div>
          <div class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-1 text-center">
          <div>
            <div class="text-[10px] text-emerald-400 font-bold">${d.revenue}tr</div>
            <div class="text-[8px] text-white/20">DS</div>
          </div>
          <div>
            <div class="text-[10px] text-blue-400 font-bold">${d.customers}</div>
            <div class="text-[8px] text-white/20">Khách</div>
          </div>
          <div>
            <div class="text-[10px] text-purple-400 font-bold">${d.services}</div>
            <div class="text-[8px] text-white/20">DV</div>
          </div>
        </div>
      </div>
    `;
          })
          .join('');
      }

      // ===== PODIUM =====
      function renderPodium(data) {
        const el = document.getElementById('podiumGrid');
        const sorted = [...members].sort((a, b) => data[b.id][sortMetric] - data[a.id][sortMetric]);
        const top3 = sorted.slice(0, 3);

        // Reorder for display: 2nd, 1st, 3rd
        const display = [top3[1], top3[0], top3[2]];
        const heights = [100, 130, 75];
        const barColors = [
          'from-gray-400/20 to-gray-500/10 border-gray-400/20',
          'from-gold/25 to-gold/10 border-gold/30',
          'from-orange-400/20 to-orange-500/10 border-orange-400/20',
        ];
        const crownIcons = ['', '<i class="fas fa-crown text-gold text-sm mb-1"></i>', ''];
        const rankLabels = ['#2', '#1', '#3'];
        const rankColors = ['text-gray-300', 'text-gold', 'text-orange-400'];

        el.innerHTML = display
          .map((m, i) => {
            const d = data[m.id];
            const val = d[sortMetric];
            let displayVal;
            const sm = metrics.find((x) => x.key === sortMetric);
            if (sm.format === 'currency') displayVal = val + 'tr';
            else if (sm.format === 'rating') displayVal = val + '★';
            else if (sm.format === 'percent') displayVal = val + '%';
            else displayVal = val;

            return `
      <div class="podium-col">
        <div class="podium-avatar-section">
          ${crownIcons[i]}
          <div class="w-10 h-10 rounded-full bg-gradient-to-br ${m.color} flex items-center justify-center text-xs font-bold text-white border-2 border-darkBg shadow-lg">
            ${m.id}
          </div>
          <span class="text-[10px] font-semibold text-white/70 mt-1 truncate max-w-[80px]">${m.name}</span>
        </div>
        <div class="podium-bar bg-gradient-to-t ${barColors[i]} border border-t-0" style="height: ${heights[i]}px;">
          <span class="text-lg font-black ${rankColors[i]}">${rankLabels[i]}</span>
          <span class="text-[10px] font-bold text-white/60 mt-0.5">${displayVal}</span>
        </div>
      </div>
    `;
          })
          .join('');
      }

      // ===== CONFIG PANEL =====
      function toggleConfigPanel() {

      function renderConfigPanel() {

        el.innerHTML = periods

        <button onclick="toggleConfigSection('${period}')" class="w-full flex items-center justify-between px-3 py-2.5 hover:bg-white/[0.03] transition-all">

        <!-- Section Body -->
        <div class="config-section-body ${isCurrentPeriod ? 'expanded' : ''}" id="configSection-${period}">
          <div class="px-3 pb-3 space-y-2">
            ${metrics
              .map(
                (m) => `
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md ${m.bgColor} flex items-center justify-center flex-shrink-0">
                  <i class="fas ${m.icon} ${m.color} text-[9px]"></i>
                </div>
                <span class="text-[11px] text-white/50 flex-1">${m.label}</span>

                  class="w-[80px] h-7 rounded-lg bg-darkBg border border-darkBorder text-white text-xs text-center font-semibold focus:border-gold/50 focus:outline-none transition-colors"
                  value="${t[m.key]}"
                  data-period="${period}"
                  data-metric="${m.key}"
                  step="${m.key === 'rating' ? '0.1' : '1'}"
                  min="0"
                  onchange="updateTargetValue(this)"
                >
              </div>
            `
              )
              .join('')}
          </div>
        </div>
      </div>
    `;
          })
          .join('');
      }

      function toggleConfigSection(period) {
        const section = document.getElementById(`configSection-${period}`);
        const arrow = document.querySelector(`.config-arrow-${period}`);
        section.classList.toggle('expanded');
        arrow.classList.toggle('rotate-180');
      }

      function updateTargetValue(input) {
        const period = input.dataset.period;
        const metric = input.dataset.metric;
        targets[period][metric] = parseFloat(input.value) || 0;
      }

      function saveAllTargets() {
        // Collect all values from inputs
        document.querySelectorAll('#configBody input[type="number"]').forEach((input) => {
          const period = input.dataset.period;
          const metric = input.dataset.metric;
          targets[period][metric] = parseFloat(input.value) || 0;
        });
        // Re-render
        renderAll();
        // Show toast
        showToast();
      }

      function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      // ===== INITIAL OPEN =====
      setTimeout(() => openModal(), 300);
    </script>
