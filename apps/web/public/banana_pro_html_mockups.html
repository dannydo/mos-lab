<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Pro Header Mockups - 10 Thiết kế Giao diện</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --banana-yellow: #ffe135;
      --banana-gold: #eab308;
      --banana-light: #fef08a;
      --banana-green: #22c55e;
      --banana-brown: #78350f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 320px;
      background-color: #0b0f19;
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-dark);
      background: linear-gradient(135deg, var(--banana-gold), var(--banana-yellow));
      color: #000;
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .sidebar-header p {
      font-size: 11px;
      opacity: 0.8;
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .nav-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 12px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover {
      background-color: rgba(255, 225, 53, 0.08);
      border-color: rgba(255, 225, 53, 0.2);
    }

    .nav-item.active {
      background-color: var(--banana-yellow);
      color: #000;
      font-weight: 600;
    }

    .nav-index {
      font-size: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .nav-item.active .nav-index {
      background-color: rgba(0, 0, 0, 0.15);
      color: #000;
    }

    .nav-title {
      font-size: 14px;
      flex: 1;
    }

    /* Main Preview Container */
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0d121f;
      position: relative;
    }

    .preview-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-dark);
      background-color: #0f1626;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-info h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .preview-info p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Simulated CRM App Header Viewport */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: radial-gradient(circle at center, #1b2640 0%, #0d121f 100%);
      overflow: auto;
    }

    .simulated-header {
      width: 90%;
      max-width: 900px;
      height: 70px;
      background-color: #141b2d;
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: var(--banana-yellow);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-item {
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .control-item:hover {
      color: var(--text-main);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 16px;
      border-left: 1px solid var(--border-dark);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background-color: var(--banana-gold);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Online Avatars Stack Area */
    .online-stack-wrapper {
      margin-right: 8px;
    }

    /* Mockup-Specific CSS Styles */
    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2px solid #141b2d;
      position: relative;
      background-color: #2e3e60;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    /* Design 1: Banana Yellow Pill */
    .design-pill-container {
      background-color: var(--banana-yellow);
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 1px solid rgba(0, 0, 0, 0.15);
    }
    .design-pill-text {
      color: #000;
      font-size: 12px;
      font-weight: 700;
    }
    .design-pill-avatars {
      display: flex;
    }
    .design-pill-avatars .avatar-circle {
      margin-left: -8px;
      border-color: var(--banana-yellow);
    }
    .design-pill-avatars .avatar-circle:first-child {
      margin-left: 0;
    }

    /* Design 2: Banana Slice Frame */
    .design-slice-stack {
      display: flex;
      gap: 8px;
    }
    .design-slice-stack .avatar-circle {
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      background-color: var(--banana-yellow);
      color: #000;
      border: none;
      border-radius: 0;
      box-shadow: 0 0 5px rgba(255,225,53,0.5);
    }

    /* Design 3: Gold Glow Mode */
    .design-glow-stack {
      display: flex;
      gap: 6px;
    }
    .design-glow-stack .avatar-circle {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
      animation: goldPulse 2s infinite ease-in-out;
    }
    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 4px rgba(255,215,0,0.5); }
      50% { box-shadow: 0 0 12px rgba(255,215,0,0.9); }
    }

    /* Design 4: Split Capsules */
    .design-split-container {
      display: flex;
      gap: 8px;
    }
    .role-capsule {
      background-color: rgba(255, 225, 53, 0.15);
      border: 1px solid rgba(255, 225, 53, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--banana-light);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* Design 5: Floating Sidebar */
    .sidebar-trigger {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .sidebar-trigger:hover {
      background-color: rgba(255, 225, 53, 0.1);
    }
    .design-sidebar-panel {
      position: absolute;
      top: 72px;
      right: 24px;
      width: 250px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 225, 53, 0.3);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 100;
      display: none;
    }
    .design-sidebar-panel h3 {
      font-size: 12px;
      color: var(--banana-yellow);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sidebar-user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    /* Design 6: Ripeness Indicators */
    .design-ripeness-stack {
      display: flex;
      gap: 6px;
    }
    .ripeness-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid #141b2d;
    }

    /* Design 7: Accordion Header */
    .design-accordion-stack {
      display: flex;
      transition: all 0.3s ease;
      width: 120px;
      overflow: hidden;
      border-radius: 20px;
      background-color: var(--card-dark);
      padding: 2px;
      border: 1px solid var(--border-dark);
    }
    .design-accordion-stack:hover {
      width: 240px;
      background-color: rgba(255, 225, 53, 0.05);
      border-color: var(--banana-yellow);
    }
    .design-accordion-stack .avatar-circle {
      margin-left: -10px;
      transition: margin 0.3s;
    }
    .design-accordion-stack:hover .avatar-circle {
      margin-left: 4px;
    }
    .design-accordion-stack .avatar-circle:first-child {
      margin-left: 2px;
    }

    /* Design 8: Shake Wobble */
    .design-shake-stack {
      display: flex;
      gap: 6px;
    }
    .shake-avatar {
      animation: bananaShake 4s infinite ease-in-out;
    }
    @keyframes bananaShake {
      0%, 90%, 100% { transform: rotate(0deg) scale(1); }
      92%, 96% { transform: rotate(-10deg) scale(1.05); }
      94%, 98% { transform: rotate(10deg) scale(1.05); }
    }

    /* Design 9: Neon Pulse Line */
    .design-pulse-line-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .pulse-line-avatars {
      display: flex;
      gap: 8px;
    }
    .pulse-line {
      width: 100%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, var(--banana-yellow), transparent);
      margin-top: 4px;
      box-shadow: 0 0 6px var(--banana-yellow);
      animation: linePulse 2s infinite ease-in-out;
    }
    @keyframes linePulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Design 10: Curved Crescent */
    .design-crescent-stack {
      display: flex;
      position: relative;
      height: 40px;
      width: 100px;
    }
    .crescent-avatar {
      position: absolute;
    }

    /* Details Panel */
    .details-panel {
      padding: 24px;
      background-color: #0b0f19;
      border-top: 1px solid var(--border-dark);
      font-size: 14px;
      line-height: 1.6;
    }

    .details-panel h3 {
      font-size: 16px;
      color: var(--banana-yellow);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .badge-preview {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

        id: 9,
        title: "9. Neon Banana Pulse Line (Đường sóng xung kích)",
        desc: "Đường neon mỏng màu vàng chạy dưới chân cụm avatar thể hiện trạng thái hoạt động.",
        details: "Bổ sung một đường kẻ sáng màu vàng mảnh nằm ngay dưới đáy thanh avatar stack. Đường kẻ này liên tục nhấp nháy phát sáng nhẹ để biểu thị đường truyền hoạt động thời gian thực ổn định.",
        html: \`
          <div class="design-pulse-line-stack">
            <div class="pulse-line-avatars">
              <div class="avatar-circle">DW</div>
              <div class="avatar-circle" style="background-color: var(--banana-light); color: #000;">TN</div>
              <div class="avatar-circle">BH</div>
            </div>
            <div class="pulse-line"></div>
          </div>
        \`
      },
      {
        id: 10,
        title: "10. Curved Banana Crescent (Đồng hồ cát cong)",
        desc: "Cụm avatar được xếp cong thành hình quả chuối thay vì một đường thẳng tẻ nhạt.",
        details: "Một điểm phá cách mang tính nghệ thuật cho giao diện. Các avatar được dịch chuyển tọa độ để xếp theo hình vòng cung lưỡi liềm (giống quả chuối). Thiết kế mang tính độc quyền nhận diện cao.",
        html: \`
          <div class="design-crescent-stack">
            <div class="avatar-circle crescent-avatar" style="top: 8px; left: 0px;">DW</div>
            <div class="avatar-circle crescent-avatar" style="top: 0px; left: 24px; background-color: var(--banana-light); color: #000;">TN</div>
            <div class="avatar-circle crescent-avatar" style="top: 8px; left: 48px;">BH</div>
          </div>
        \`
      }
    ];

    // Populate Sidebar
    const navList = document.getElementById('navList');
    concepts.forEach((concept, index) => {
      const li = document.createElement('li');
      li.className = \`nav-item \${index === 0 ? 'active' : ''}\`;
      li.innerHTML = \`
        <span class="nav-index">\${concept.id}</span>
        <span class="nav-title">\${concept.title.split('. ')[1]}</span>
      \`;
      li.onclick = () => selectConcept(index);
      navList.appendChild(li);
    });

    // Select Concept Logic
    function selectConcept(index) {
      // Toggle nav active states
      const items = document.querySelectorAll('.nav-item');
      items.forEach((item, idx) => {
        if (idx === index) item.classList.add('active');
        else item.classList.remove('active');
      });

      const selected = concepts[index];
      document.getElementById('conceptTitle').innerText = selected.title;
      document.getElementById('conceptDesc').innerText = selected.desc;
      document.getElementById('conceptDetails').innerText = selected.details;
      document.getElementById('mockupTarget').innerHTML = selected.html;

      // Close floating sidebar by default if not design 5
      const sidebarPanel = document.getElementById('floatingSidebarPanel');
      sidebarPanel.style.display = 'none';

      // Automatically open floating sidebar if it's design 5
      if (selected.id === 5) {
        sidebarPanel.style.display = 'block';
      }
    }

    // Toggle simulated sidebar panel (for Design 5)
    function toggleSimulatedSidebar() {
      const sidebarPanel = document.getElementById('floatingSidebarPanel');
      if (sidebarPanel.style.display === 'block') {
        sidebarPanel.style.display = 'none';
      } else {
        sidebarPanel.style.display = 'block';
      }
    }

    // Initialize first concept
    selectConcept(0);
  </script>
</body>
</html>
