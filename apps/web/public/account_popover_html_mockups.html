<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Popover Mockups - 10 Thiết kế Giao diện Trực quan</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --google-blue: #1a73e8;
      --google-gray-bg: #e9eef6;
      --google-gray-card: #f8fafd;
      
      /* Wings Lashes Brand Palette */
      --wings-gold: #fbbf24;
      --wings-gold-dark: #d97706;
      --wings-black: #0f0f10;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 320px;
      background-color: #0b0f19;
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-dark);
      background: linear-gradient(135deg, #1a73e8, #fbbf24);
      color: #fff;
    }

    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .sidebar-header p {
      font-size: 10px;
      opacity: 0.8;
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 12px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover {
      background-color: rgba(26, 115, 232, 0.08);
      border-color: rgba(26, 115, 232, 0.2);
    }

    .nav-item.active {
      background-color: var(--google-blue);
      color: #fff;
      font-weight: 600;
    }

    .nav-index {
      font-size: 9px;
      background-color: rgba(255, 255, 255, 0.15);
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .nav-title {
      font-size: 13px;
      flex: 1;
      line-height: 1.3;
    }

    /* Main Preview Container */
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0d121f;
      position: relative;
    }

    .preview-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-dark);
      background-color: #0f1626;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-info h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .preview-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Simulated App Header Viewport */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: radial-gradient(circle at center, #1e293b 0%, #0d121f 100%);
      position: relative;
    }

    .simulated-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
    }

    /* Top Google Style Header Row */
    .simulated-header-row {
      width: 100%;
      height: 56px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #3c4043;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .header-icons-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .h-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background-color 0.15s;
    }

    .h-icon-btn:hover {
      background-color: #f1f3f4;
    }

    .share-pill {
      background-color: #c2e7ff;
      color: #001d35;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .share-pill:hover {
      background-color: #b3dbf6;
    }

    .avatar-trigger {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--wings-black);
      border: 1px solid #ddd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Popover Target Render Container */
    .popover-render-area {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
      min-height: 480px;
    }

    /* Details Panel */
    .details-panel {
      padding: 24px;
      background-color: #0b0f19;
      border-top: 1px solid var(--border-dark);
      font-size: 14px;
      line-height: 1.6;
    }

    .details-panel h3 {
      font-size: 16px;
      color: var(--google-blue);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .interactive-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background-color: rgba(26, 115, 232, 0.15);
      color: var(--google-blue);
    }
  </style>
</head>

        <div class="popover-render-area" id="popoverRenderArea">

        </div>

    </div>

    <!-- Description Details -->

      <h3>Ý nghĩa giải pháp (Design & UX Goal)</h3>
      <p id="conceptDetails">Đang tải...</p>

    concepts.forEach((concept, index) => {
      const li = document.createElement('li');
      li.className = `nav-item ${index === 0 ? 'active' : ''}`;
      li.innerHTML = `
        <span class="nav-index">${concept.id}</span>
        <span class="nav-title">${concept.title.split('. ')[1]}</span>
      `;
      li.onclick = () => selectConcept(index);
      navList.appendChild(li);
    });

    // Toggle popover display logic
    let isPopoverOpen = true;
    function togglePopoverDisplay() {
      const popoverArea = document.getElementById('popoverRenderArea');
      const activeIdx = Array.from(document.querySelectorAll('.nav-item')).findIndex(item => item.classList.contains('active'));
      
      if (isPopoverOpen) {
        popoverArea.innerHTML = `
          <div style="width: 380px; height: 120px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); border: 1px dashed var(--border-dark); border-radius: 12px; color: var(--text-muted); font-size: 12px; cursor: pointer;" onclick="togglePopoverDisplay()">
            [ Đã đóng Dropdown. Bấm vào Avatar góc phải trên Header để mở lại ]
          </div>
        `;
        isPopoverOpen = false;
      } else {
        popoverArea.innerHTML = concepts[activeIdx].html;
        isPopoverOpen = true;
      }
    }

    // Select Concept Logic
    function selectConcept(index) {
      // Toggle nav active states
      const items = document.querySelectorAll('.nav-item');
      items.forEach((item, idx) => {
        if (idx === index) item.classList.add('active');
        else item.classList.remove('active');
      });

      const selected = concepts[index];
      document.getElementById('conceptTitle').innerText = selected.title;
      document.getElementById('conceptDesc').innerText = selected.desc;
      document.getElementById('conceptDetails').innerText = selected.details;
      
      // Update popover area html directly
      const popoverArea = document.getElementById('popoverRenderArea');
      popoverArea.innerHTML = selected.html;
      isPopoverOpen = true;

      // Adjust simulated background colors for Google-like feel depending on selection
      const headerRow = document.getElementById('headerRow');
      if (selected.id === 1 || selected.id === 10) {
        headerRow.style.backgroundColor = '#ffffff';
        headerRow.style.color = '#3c4043';
        headerRow.style.borderBottomColor = '#e0e0e0';
      } else {
        headerRow.style.backgroundColor = '#151f32';
        headerRow.style.color = '#f1f6f9';
        headerRow.style.borderBottomColor = 'var(--border-dark)';
      }
    }

    // Initialize first concept
    selectConcept(0);
  </script>
